# ──────────────────────────────────────────────────────────────────────────────
# Valkey — standalone deployment (baseline, no operator)
#
# To test your valkey-operator instead, delete this file and apply
# k8s/valkey-operator/valkey-cr.yaml — the app's ConfigMap already points
# to the same Service name "valkey", so no other change is needed.
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: bookstore
  labels:
    app: valkey
    app.kubernetes.io/name: valkey
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      containers:
      - name: valkey
        image: valkey/valkey:8-alpine
        ports:
        - containerPort: 6379
          name: valkey
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        readinessProbe:
          exec:
            command: ["valkey-cli", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
        livenessProbe:
          exec:
            command: ["valkey-cli", "ping"]
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: bookstore
  labels:
    app: valkey
    app.kubernetes.io/name: valkey
spec:
  selector:
    app: valkey
  ports:
  - port: 6379
    targetPort: 6379
    name: valkey
  type: ClusterIP
